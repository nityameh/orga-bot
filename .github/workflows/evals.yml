# Agent evals (ADR-013). Runs the live-model eval suite when agent behaviour can
# change: the agent loop, tools, providers or prompts. Fails if the pass rate
# drops more than 2 points below evals/baseline.json for the provider/model.
# Needs ANTHROPIC_API_KEY (preferred) or GROQ_API_KEY as a repository secret;
# skips cleanly when neither is set.
name: Evals

on:
  pull_request:
    paths:
      - 'src/agent/**'
      - 'src/llm/**'
      - 'prompts/**'
      - 'evals/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NODE_ENV: test
    steps:
      - name: Skip when no LLM key is configured
        if: env.ANTHROPIC_API_KEY == '' && env.GROQ_API_KEY == ''
        run: echo "::notice::No ANTHROPIC_API_KEY or GROQ_API_KEY secret — evals skipped."
      - uses: actions/checkout@v7
        if: env.ANTHROPIC_API_KEY != '' || env.GROQ_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != '' || env.GROQ_API_KEY != ''
        with:
          node-version: 20
          cache: npm
      - if: env.ANTHROPIC_API_KEY != '' || env.GROQ_API_KEY != ''
        run: npm ci && npx prisma generate
      - name: Run eval suite
        if: env.ANTHROPIC_API_KEY != '' || env.GROQ_API_KEY != ''
        run: npm run evals
      - uses: actions/upload-artifact@v4
        if: always() && (env.ANTHROPIC_API_KEY != '' || env.GROQ_API_KEY != '')
        with:
          name: eval-report
          path: evals/reports/
          retention-days: 30
