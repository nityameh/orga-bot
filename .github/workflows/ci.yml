# CI — every push and pull request must pass all jobs before merging (CLAUDE.md §0.4).
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16   # Postgres 16 + pgvector (ADR-016)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orga_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orga_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orga_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Check schema and migrations are in sync
        run: node scripts/check-schema-drift.js
      - name: Unit + integration tests with coverage thresholds
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  dashboard:
    name: Dashboard — typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  embeddings:
    name: Embedding model — real open-source model smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache downloaded model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-multilingual-e5-small-q8
      - run: node scripts/check-embedder.js

  docker:
    name: Deployment — Docker image builds, compose file valid
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t orga-api:ci .
      - name: Validate docker-compose.yml
        run: cp .env.example .env && POSTGRES_PASSWORD=ci API_DOMAIN=example.sslip.io docker compose config --quiet
      - name: Validate render.yaml is parseable YAML
        run: python3 -c "import yaml,sys; yaml.safe_load(open('render.yaml'))"

  security:
    name: Security — dependency audit, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks lists a PR's commits through the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit production dependencies (backend)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit production dependencies (dashboard)
        run: npm audit --omit=dev --audit-level=high
        working-directory: dashboard
      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
