# Static analysis for security bugs (injection, unsafe regex, etc.).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read # analyze reads the workflow run (needed if the repo is ever private again)

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml # queries + documented exclusions
      # Public repo: results go to the Security tab (code scanning is free for
      # public repos). The job also fails on any finding so a PR can't merge with one.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: always
          output: sarif-results
      - name: Fail on findings
        run: |
          count=$(jq '[.runs[].results[]] | length' sarif-results/*.sarif)
          jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' sarif-results/*.sarif
          echo "CodeQL findings: $count"
          test "$count" -eq 0
