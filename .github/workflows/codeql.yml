# Static analysis for security bugs (injection, unsafe regex, etc.).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read # required on private repos: analyze reads the workflow run

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml # queries + documented exclusions
      # Code scanning (the Security tab) needs GitHub Advanced Security on private
      # repos, so results aren't uploaded; this job fails on any finding instead.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: sarif-results
      - name: Fail on findings
        run: |
          count=$(jq '[.runs[].results[]] | length' sarif-results/*.sarif)
          jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' sarif-results/*.sarif
          echo "CodeQL findings: $count"
          test "$count" -eq 0
